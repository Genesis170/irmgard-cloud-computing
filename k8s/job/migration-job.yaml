apiVersion: batch/v1
kind: Job
metadata:
  name: irmgard-db-migration
spec:
  template:
    spec:
      containers:
        - name: migration
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              psql "$DATABASE_URL" -c "
                CREATE TABLE IF NOT EXISTS images (
                  id SERIAL PRIMARY KEY,
                  name TEXT,
                  storage_location TEXT
                );
                GRANT CONNECT ON DATABASE postgres TO irmgard_app;
                GRANT USAGE ON SCHEMA public TO irmgard_app;
                GRANT SELECT, INSERT, UPDATE ON images TO irmgard_app;
                GRANT USAGE, SELECT ON SEQUENCE images_id_seq TO irmgard_app;
              "
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgreshtw.irmgard-postgres.credentials.postgresql.acid.zalan.do
                  key: password
            - name: DATABASE_URL
              value: "postgresql://postgreshtw@irmgard-postgres:5432/postgres"
      restartPolicy: OnFailure