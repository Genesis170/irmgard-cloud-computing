apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  kind: ClusterRole
  name: fluentd
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: k8s-training
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      serviceAccountName: fluentd
      containers:
        - name: fluentd
          image: fluent/fluentd:v1.17-1
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              apk add --no-cache build-base
              gem install fluent-plugin-kubernetes_metadata_filter fluent-plugin-opensearch --no-document
              fluentd -c /fluentd/etc/fluent.conf
          env:
            - name: FLUENT_OPENSEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: config-htw
                  key: OPENSEARCH_HOST
            - name: FLUENT_OPENSEARCH_PORT
              valueFrom:
                configMapKeyRef:
                  name: config-htw
                  key: OPENSEARCH_PORT
            - name: FLUENT_OPENSEARCH_SCHEME
              valueFrom:
                configMapKeyRef:
                  name: config-htw
                  key: OPENSEARCH_SCHEME
            - name: FLUENT_OPENSEARCH_SSL_VERIFY
              value: "false"
            - name: FLUENT_OPENSEARCH_USER
              valueFrom:
                secretKeyRef:
                  name: secret-htw
                  key: opensearch-user
            - name: FLUENT_OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-htw
                  key: opensearch-password
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: fluentd-config
              mountPath: /fluentd/etc
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: fluentd-config
          configMap:
            name: fluentd-config